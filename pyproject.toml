[project]
name = "head-timer-tracker"
version = "0.1.0"
description = "OBS head-tracking timer widget — pin a timer source to streamer's forehead"
requires-python = ">=3.11,<3.14"
dependencies = [
    "nicegui>=1.4.0,<2.0.0",
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "obsws-python>=1.0.0",
    "numpy>=1.24.0",
    "pystray>=0.19.0",
    "pillow>=10.0.0",
]

[project.scripts]
head-tracker = "run:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
