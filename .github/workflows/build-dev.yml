name: Dev Build

on:
  push:
    branches:
      - optimize

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Download MediaPipe model
        run: |
          mkdir models
          curl -fsSL -o models/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task

      - name: Convert icon
        run: uv run python tools/convert_icon.py

      - name: Build with PyInstaller
        run: uv run pyinstaller --clean --noconfirm MisterTimer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MisterTimer-dev
          path: dist/MisterTimer
