name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Download MediaPipe model
        run: |
          mkdir models
          curl -fsSL -o models/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task

      - name: Convert icon
        run: uv run python -c "from PIL import Image; img = Image.open('icon.png'); img.save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build with PyInstaller
        run: uv run pyinstaller --clean --noconfirm HeadTimerTracker.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadTimerTracker.exe
          path: dist/HeadTimerTracker/HeadTimerTracker.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HeadTimerTracker.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: HeadTimerTracker.exe
          generate_release_notes: true
